syntax = "proto3";

option go_package = "gateway/internal/pb";
option java_package = "com.example.stakeholders.grpc";
option java_multiple_files = true;
package users;

service UserService {
  rpc GetUser(GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  int64 id = 1;
}

message UserResponse {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string role = 4;
  string bio = 5;
}
